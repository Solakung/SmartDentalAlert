<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Dental Alert</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ตารางนัดรายวันทางซ้าย + แผงรายละเอียดผู้ป่วยทางขวา (มือถือ: แผงเลื่อนลงใต้รายการ) */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface2:#eaeff1; --line:#d6dde0; --fg:#18242b; --muted:#5a6b74;
  --accent:#17566e; --accent-fg:#ffffff; --accent-soft:#dcebf1;
  --hi:#b3261e; --hi-bg:#fbe3e0; --mid:#8a5a00; --mid-bg:#fbefcf; --lo:#1d6b3a; --lo-bg:#dcf1e2;
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1f; --surface:#17252c; --surface2:#1e2f37; --line:#2c424c; --fg:#e6eef1; --muted:#97aab3;
  --accent:#6cc0dc; --accent-fg:#06222d; --accent-soft:#1b3a47;
  --hi:#ff8f86; --hi-bg:#44211f; --mid:#f0c35c; --mid-bg:#40330f; --lo:#7fd69a; --lo-bg:#173a25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#17252c; --surface2:#1e2f37; --line:#2c424c; --fg:#e6eef1; --muted:#97aab3;
  --accent:#6cc0dc; --accent-fg:#06222d; --accent-soft:#1b3a47;
  --hi:#ff8f86; --hi-bg:#44211f; --mid:#f0c35c; --mid-bg:#40330f; --lo:#7fd69a; --lo-bg:#173a25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
h1{font-size:1.5rem;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.badge{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:4px;background:var(--mid-bg);color:var(--mid);white-space:nowrap}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sum button{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;gap:2px}
.sum button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sum .n{font-size:1.8rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sum .l{font-size:.85rem;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.hi{--c:var(--hi);--cb:var(--hi-bg)}.medium{--c:var(--mid);--cb:var(--mid-bg)}.low{--c:var(--lo);--cb:var(--lo-bg)}
.high{--c:var(--hi);--cb:var(--hi-bg)}
.dot{background:var(--c)}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.day{margin-bottom:14px}
.day h3{margin:0 0 6px;font-size:.85rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row .t{font-size:.8rem;color:var(--muted)}
.row .id{font-family:var(--mono);font-weight:500}
.row .meta{display:block;font-size:.85rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:3px 9px;font-size:.82rem;font-weight:600;background:var(--cb);color:var(--c);white-space:nowrap}
.pill b{font-family:var(--mono);font-weight:500}
.done-mark{font-size:.75rem;color:var(--lo);font-weight:600;display:block;text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media(max-width:820px){.panel{position:static}}
.panel h2{margin:0;font-size:1.15rem}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin:0}
.kv div{min-width:0}.kv dt{font-size:.78rem;color:var(--muted)}.kv dd{margin:0;font-weight:500}
.reasons{margin:0;padding-left:1.2em}.reasons li{margin:2px 0}
.sec{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:0 0 6px}
.gauge{height:8px;border-radius:4px;background:var(--surface2);position:relative;overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:4px}
.act{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.act input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.act label{cursor:pointer}
.act input:checked + label{color:var(--muted);text-decoration:line-through}
.note{font-size:.82rem;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.card h2{font-size:1.05rem;margin:0 0 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}
.mets div{background:var(--surface2);border-radius:4px;padding:10px 12px}
.mets .v{font-size:1.4rem;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mets .k{font-size:.78rem;color:var(--muted)}
.bar{display:grid;grid-template-columns:minmax(90px,130px) minmax(0,1fr) 52px;gap:10px;align-items:center;margin:7px 0;font-size:.88rem}
.bar .track{height:14px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;border-radius:3px}
.bar .num{font-family:var(--mono);font-size:.8rem;text-align:right;color:var(--muted)}
.g-Predisposing{background:var(--accent)}.g-Enabling{background:var(--mid)}.g-Need{background:var(--lo)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);margin:6px 0 4px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.risk3{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.footer{font-size:.82rem;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.gauge i,.bar .fill{transition:width .3s}}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.88rem;font-weight:500;border:0;background:none;color:var(--muted);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;margin-top:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0;width:100%}
textarea{font-family:var(--mono);font-size:.8rem;min-height:110px;resize:vertical}
.btn{font:inherit;font-weight:600;border-radius:5px;padding:8px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg)}
.btn.sec2{background:none;color:var(--accent)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.msg{font-size:.88rem;margin:10px 0 0;padding:8px 12px;border-radius:4px;background:var(--surface2)}
.msg.err{background:var(--hi-bg);color:var(--hi)}.msg.ok{background:var(--lo-bg);color:var(--lo)}
code.block{display:block;white-space:pre;overflow-x:auto;background:var(--surface2);padding:10px 12px;border-radius:4px;font-family:var(--mono);font-size:.78rem;margin:8px 0 0}
.outc{display:flex;gap:8px}
.outc button{flex:1;font:inherit;padding:8px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.outc button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.cutrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
.tag{font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:middle}
.chats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.chat{background:var(--surface2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chat h3{margin:0;font-size:.9rem}.chat .why{font-size:.78rem;color:var(--muted);margin:0}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;white-space:pre-line;font-size:.9rem;overflow-wrap:anywhere}
.qr{display:flex;flex-wrap:wrap;gap:6px}.qr span{border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:14px;padding:3px 12px;font-size:.82rem;font-weight:500}
.skip{font-size:.85rem;color:var(--muted);padding:10px 0}

.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:1.4rem}
.userbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.85rem;color:var(--muted)}
.banner{background:var(--mid-bg);color:var(--mid);padding:8px 12px;border-radius:4px;font-size:.85rem;font-weight:500}
.mono{font-family:var(--mono);overflow-wrap:anywhere}

.lm{margin:8px 0}.lm-h{font-size:.78rem;color:var(--muted);margin-bottom:3px}.lm.lock{opacity:.5}
.bubble{background:#2a2d2f;color:#f1f3f4;border-radius:4px 14px 14px 14px;padding:10px 12px;white-space:pre-line;font-size:.85rem;line-height:1.5}
.bubble mark{background:#5b4b00;color:#ffe9a0;border-radius:3px;padding:0 3px}
body{margin:0;padding-top:20px}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="note">กำลังโหลด…</p></div>
<script type="module" src="app.js"></script>
</body>
</html>
